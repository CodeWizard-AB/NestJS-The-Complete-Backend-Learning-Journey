<!doctype html>
<html>
  <head>
    <title>File Upload System</title>
    <style>
      body {
        font-family: Arial;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      .upload-section {
        border: 1px solid #ccc;
        padding: 20px;
        margin: 20px 0;
        border-radius: 5px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .result {
        margin-top: 20px;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 3px;
      }
      img {
        max-width: 200px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h1>📁 File Upload System</h1>

    <!-- Single File Upload -->
    <div class="upload-section">
      <h2>Single File Upload</h2>
      <form id="singleForm">
        <input type="file" name="file" required />
        <button type="submit">Upload</button>
      </form>
      <div id="singleResult" class="result"></div>
    </div>

    <!-- Multiple Files Upload -->
    <div class="upload-section">
      <h2>Multiple Files Upload</h2>
      <form id="multipleForm">
        <input type="file" name="files" multiple required />
        <button type="submit">Upload All</button>
      </form>
      <div id="multipleResult" class="result"></div>
    </div>

    <!-- Profile Upload (Avatar + Cover) -->
    <div class="upload-section">
      <h2>Profile Upload</h2>
      <form id="profileForm">
        <label>Avatar:</label>
        <input type="file" name="avatar" required /><br /><br />
        <label>Cover:</label>
        <input type="file" name="cover" required /><br /><br />
        <button type="submit">Upload Profile</button>
      </form>
      <div id="profileResult" class="result"></div>
    </div>

    <!-- View Uploaded Files -->
    <div class="upload-section">
      <h2>My Uploaded Files</h2>
      <button onclick="loadFiles()">Load My Files</button>
      <div id="filesList" class="result"></div>
    </div>

    <script>
      const API_URL = 'http://localhost:3000';
      const token = localStorage.getItem('access_token'); // Assuming you have JWT

      // Single file upload
      document
        .getElementById('singleForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);

          try {
            const response = await fetch(`${API_URL}/upload/single`, {
              method: 'POST',
              body: formData,
            });

            const data = await response.json();
            document.getElementById('singleResult').innerHTML = `
          <p>✅ ${data.message}</p>
          <p>Filename: ${data.file.filename}</p>
          <p>Size: ${(data.file.size / 1024).toFixed(2)} KB</p>
          <img src="${API_URL}/uploads/${data.file.filename}">
        `;
          } catch (error) {
            document.getElementById('singleResult').innerHTML =
              `<p>❌ Error: ${error.message}</p>`;
          }
        });

      // Multiple files upload
      document
        .getElementById('multipleForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData();
          const files = e.target.files.files;

          for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
          }

          try {
            const response = await fetch(`${API_URL}/upload/multiple`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
              },
              body: formData,
            });

            const data = await response.json();
            document.getElementById('multipleResult').innerHTML = `
          <p>✅ ${data.message}</p>
          ${data.files
            .map(
              (f) => `
            <div>
              <p>${f.originalName}</p>
              <img src="${API_URL}/uploads/${f.filename}">
            </div>
          `,
            )
            .join('')}
        `;
          } catch (error) {
            document.getElementById('multipleResult').innerHTML =
              `<p>❌ Error: ${error.message}</p>`;
          }
        });

      // Profile upload
      document
        .getElementById('profileForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);

          try {
            const response = await fetch(`${API_URL}/upload/profile`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
              },
              body: formData,
            });

            const data = await response.json();
            document.getElementById('profileResult').innerHTML = `
          <p>✅ ${data.message}</p>
          <div>
            <p>Avatar:</p>
            <img src="${API_URL}/uploads/${data.avatar}">
          </div>
          <div>
            <p>Cover:</p>
            <img src="${API_URL}/uploads/${data.cover}">
          </div>
        `;
          } catch (error) {
            document.getElementById('profileResult').innerHTML =
              `<p>❌ Error: ${error.message}</p>`;
          }
        });

      // Load user files
      async function loadFiles() {
        try {
          const response = await fetch(`${API_URL}/upload/my-files`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const files = await response.json();
          document.getElementById('filesList').innerHTML = files
            .map(
              (file) => `
          <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
            <p><strong>${file.originalName}</strong></p>
            <p>Size: ${(file.size / 1024).toFixed(2)} KB</p>
            <p>Type: ${file.mimetype}</p>
            <img src="${API_URL}/uploads/${file.filename}" style="max-width: 150px;">
            <br>
            <button onclick="deleteFile('${file._id}')">Delete</button>
            <a href="${API_URL}/upload/download/${file._id}">
              <button>Download</button>
            </a>
          </div>
        `,
            )
            .join('');
        } catch (error) {
          document.getElementById('filesList').innerHTML =
            `<p>❌ Error: ${error.message}</p>`;
        }
      }

      // Delete file
      async function deleteFile(id) {
        if (!confirm('Are you sure you want to delete this file?')) return;

        try {
          await fetch(`${API_URL}/upload/${id}`, {
            method: 'DELETE',
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          alert('File deleted successfully!');
          loadFiles(); // Refresh list
        } catch (error) {
          alert('Error deleting file: ' + error.message);
        }
      }
    </script>
  </body>
</html>
